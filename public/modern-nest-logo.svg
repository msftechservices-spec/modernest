<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Botanical element circle -->
  <circle cx="30" cy="30" r="18" fill="#cba8cb" opacity="0.8"/>
  
  <!-- Botanical stems and flowers -->
  <g transform="translate(30, 30)" fill="#ffffff" opacity="0.9">
    <!-- Main stems -->
    <path d="M-8 5 L-8 -15 M-3 3 L-3 -18 M2 4 L2 -16 M7 2 L7 -17" stroke="#ffffff" stroke-width="0.8" fill="none"/>
    
    <!-- Small flowers/buds -->
    <circle cx="-8" cy="-15" r="1.5"/>
    <circle cx="-3" cy="-18" r="1.2"/>
    <circle cx="2" cy="-16" r="1.3"/>
    <circle cx="7" cy="-17" r="1.1"/>
    
    <!-- Additional small buds -->
    <circle cx="-6" cy="-12" r="0.8"/>
    <circle cx="-1" cy="-14" r="0.9"/>
    <circle cx="4" cy="-13" r="0.7"/>
    <circle cx="9" cy="-14" r="0.8"/>
    
    <!-- Leaves -->
    <ellipse cx="-5" cy="-8" rx="1.5" ry="3" transform="rotate(15)" opacity="0.7"/>
    <ellipse cx="1" cy="-10" rx="1.2" ry="2.5" transform="rotate(-20)" opacity="0.7"/>
    <ellipse cx="6" cy="-9" rx="1.3" ry="2.8" transform="rotate(25)" opacity="0.7"/>
  </g>
  
  <!-- Modern Nest Text -->
  <text x="60" y="25" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    Modern Nest
  </text>
  
  <!-- Tagline -->
  <text x="60" y="40" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#cba8cb" opacity="0.8">
    Curate to your comfort
  </text>
  
  <!-- Small decorative elements -->
  <circle cx="180" cy="15" r="1" fill="#cba8cb" opacity="0.6"/>
  <path d="M185 20 L190 15 M190 20 L185 15" stroke="#cba8cb" stroke-width="1" opacity="0.5"/>
</svg>